    name: GPT-6 Astra
    api_id: gpt-6-astra
    context_window: 1,050,000 tokens
    max_output: 128,000 tokens
    input_price: $10 / MTok
    output_price: $50 / MTok
    notes: Prompts above 272K input tokens are billed at higher rates for the whole request.
    lint_literals:
      - gpt-6-astra
      - 1,050,000 tokens
      - 128,000 tokens
      - $10 / MTok
      - $50 / MTok
      - 272K input tokens
    volatility: high
    source: https://developers.openai.com/api/docs/models/gpt-6-astra
