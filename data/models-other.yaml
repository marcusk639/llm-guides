# Volatile values backing guides/models/comparison.md (non-Anthropic rows).
# Claude rows are NOT duplicated here: they live in data/models.yaml and join
# the hosted table through the `comparison-hosted` tag (controller ruling R3).
#
# Row-record design mirrors data/models.yaml: one record per model, `value` is
# the API model id (hosted) or the Hugging Face repository id (open-weight),
# and `lint_fields` names every volatile field so the lint indexes its current
# value (3+ characters). Records keep explicit `lint_literals` instead where a
# volatile string is only a fragment of a field (phrases inside `notes`) or where
# a field value must not be indexed on its own (Qwen3.8-27B's `parameters: 27B`,
# which is embedded in the model id).
#
# Field alignment across vendors (hosted table):
#   context_window  - only where the vendor states a context window
#   max_input       - only where the vendor states an input limit
#   max_output      - the vendor's stated output limit
#   input_price / output_price - base paid rate, USD per million tokens
#   notes           - pricing tiers or status that change how to read the row
# Cells are left blank when the vendor page does not state the value.
#
# Prices are rewritten into one unit form ("$N / MTok" = USD per million
# tokens) so rows line up; token counts keep each vendor's own wording.
#
# OpenAI:  https://developers.openai.com/api/docs/models (and per-model pages)
#          https://developers.openai.com/api/docs/pricing
# Google:  https://ai.google.dev/gemini-api/docs/models (and per-model pages)
#          https://ai.google.dev/gemini-api/docs/pricing
# Meta:    Hugging Face model cards under https://huggingface.co/meta-llama
# Qwen:    Hugging Face model cards under https://huggingface.co/Qwen
records:
