# Volatile values backing guides/claude-code/hooks.md. One record per fact.
# Hook event names, matcher values, JSON field names, decision keywords, and
# exit-code meanings are identifiers, governed by the page's applies_to, and
# deliberately have no records here.
#
# lint_literals: every record sets an explicit, context-bound phrase. A bare
# figure such as "30 seconds" or "600" would be indexed corpus-wide and
# false-positive on unrelated pages, so the bare figure is never a literal.
records:
  - key: claude_code.hooks.timeout_default.command
    value: 600
    unit: seconds
    display: 600 seconds for command, http, and mcp_tool handlers
    lint_literals:
      - 600 seconds for command, http, and mcp_tool handlers
    volatility: medium
    source: https://code.claude.com/docs/en/hooks
    verified: "2026-09-16"
    tags: [claude-code, hooks]
  - key: claude_code.hooks.timeout_default.prompt
    value: 30
    unit: seconds
    display: 30 seconds for prompt handlers
    lint_literals:
      - 30 seconds for prompt handlers
    volatility: medium
    source: https://code.claude.com/docs/en/hooks
    verified: "2026-09-16"
    tags: [claude-code, hooks]
  - key: claude_code.hooks.timeout_default.agent
    value: 60
    unit: seconds
    display: 60 seconds for agent handlers
    lint_literals:
      - 60 seconds for agent handlers
    volatility: medium
    source: https://code.claude.com/docs/en/hooks
    verified: "2026-09-16"
    tags: [claude-code, hooks]
  - key: claude_code.hooks.timeout_default.user_prompt_submit
    value: 30
    unit: seconds
    display: 30 seconds on UserPromptSubmit, PreModelSwitch, and PostModelSwitch
    lint_literals:
      - 30 seconds on UserPromptSubmit, PreModelSwitch, and PostModelSwitch
    volatility: medium
    source: https://code.claude.com/docs/en/hooks
    verified: "2026-09-16"
    tags: [claude-code, hooks]
  - key: claude_code.hooks.session_end_budget
    value: 1.5
    unit: seconds
    display: a shared 1.5-second budget, raised to match a longer per-hook timeout up to 60 seconds
    lint_literals:
      - 1.5-second budget
    volatility: medium
    source: https://code.claude.com/docs/en/hooks
    verified: "2026-09-16"
    tags: [claude-code, hooks]
  - key: claude_code.hooks.stop_block_cap
    value: 8
    unit: consecutive blocks
    display: 8 consecutive blocks
    lint_literals:
      - 8 consecutive blocks
    volatility: medium
    source: https://code.claude.com/docs/en/hooks
    verified: "2026-09-16"
    tags: [claude-code, hooks]
  - key: claude_code.hooks.output_string_cap
    value: 10000
    unit: characters
    display: 10,000 characters
    lint_literals:
      - 10,000 characters
    volatility: medium
    source: https://code.claude.com/docs/en/hooks
    verified: "2026-09-16"
    tags: [claude-code, hooks]
  # Sandbox default backing guides/domains/software-engineering.md.
  # lint: false — the only literal form of this value is "true", which would
  # match every JSON `true` corpus-wide; any distinctive phrase would have to be
  # the identifier text around the marker block and would flag the page itself.
  - key: claude_code.sandbox.auto_allow_bash_default
    value: "true"
    display: "`true`"
    lint: false
    volatility: medium
    source: https://code.claude.com/docs/en/settings-reference
    verified: "2026-09-16"
    tags: [claude-code, sandbox]
